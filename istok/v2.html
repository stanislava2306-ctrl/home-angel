<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Исток — первый экран, версия 2</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Playfair+Display:ital@1&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   ИСТОК · ПЕРВЫЙ КАДР
   Не заголовок над картинкой, а кадр, внутри которого лежит фраза.
   Композиция асимметричная, интерфейс почти отсутствует, свет под
   курсором — не круг, а органическое пятно, размытое турбулентностью.
   ═══════════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;

  /* Цвет приходит из кадра. Интерфейс держит почти чёрное и тёплый
     не-белый: стерильный #fff на этой глубине читается как дыра. */
  --void:#040405;
  --ivory:#efe9df;
  --quiet:#8a8378;
  --faint:#575149;
  --deep:#8fa8b8;

  /* Антиква ведёт, гротеск обслуживает. Prata — высокий контраст,
     тонкие волосяные, характерные пропорции; с кириллицей. */
  --display:'Prata','Times New Roman',Times,serif;
  --italic:'Playfair Display','Times New Roman',Times,serif;
  --grotesk:'Golos Text',system-ui,-apple-system,sans-serif;

  --ease:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--ivory);font-family:var(--grotesk);
  font-weight:400;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video,svg{display:block}
:focus-visible{outline:1px solid var(--deep);outline-offset:5px}

/* ═══ НАВИГАЦИЯ ═══ Внутри кадра, без контейнера и без подложки. ═══ */
.top{position:absolute;inset:0 0 auto;z-index:6;display:flex;
  align-items:baseline;justify-content:space-between;
  padding:34px clamp(22px,4.4vw,58px);pointer-events:none}
.top>*{pointer-events:auto}
.mark{font-family:var(--display);font-size:15px;letter-spacing:.36em;
  color:var(--ivory);text-shadow:0 1px 30px rgba(4,4,5,.95)}
.top nav{display:flex;gap:clamp(18px,2.4vw,34px)}
.top nav button{font-size:12px;letter-spacing:.02em;color:rgba(239,233,223,.5);
  text-shadow:0 1px 30px rgba(4,4,5,.95);transition:color .5s var(--ease)}
.top nav button:hover{color:var(--ivory)}

/* ═══ КАДР ═══ */
.scene{position:relative;min-height:100svh;overflow:clip;isolation:isolate}
.frame{position:absolute;inset:0;z-index:0;overflow:clip;pointer-events:none}
.still,.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.still{background:url('assets/scene/origin.jpg') center/cover no-repeat;
  filter:brightness(.74) contrast(1.16) saturate(.9);
  transform:scale(1.06);animation:drift 26s var(--ease) forwards}
/* очень медленное движение камеры: кадр живой, но не «анимированный» */
@keyframes drift{to{transform:scale(1) translate3d(-1.1%,-.7%,0)}}
.video{opacity:0;transition:opacity 2.2s ease}
.video.on{opacity:1}
.video.on ~ .still{opacity:0;transition:opacity 2.2s ease}

/* Пятно света. Маска — круг, продавленный feTurbulence: край рваный
   и дышащий, поэтому это не лупа, а промоина в темноте. */
.lit{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transition:opacity 1.1s ease}
body.lit-on .lit{opacity:1}

/* Единственное затемнение на экране — вымеренный градиент вниз.
   Никаких дымок, плёнок и виньеток поверх кадра. */
.fade{position:absolute;inset:0;background:
  linear-gradient(to bottom,rgba(4,4,5,.42) 0%,rgba(4,4,5,.08) 20%,
    rgba(4,4,5,0) 40%,rgba(4,4,5,.34) 64%,rgba(4,4,5,.8) 85%,var(--void) 100%)}

/* ═══ ТИПОГРАФИКА КАК КОМПОЗИЦИЯ ═══
   Фраза разложена на два слоя: крупное утверждение и тихий отзвук,
   смещённый вправо и вниз. Симметрии нет намеренно. */
.type{position:relative;z-index:3;min-height:100svh;
  display:grid;grid-template-columns:1fr;align-content:center;
  padding:0 clamp(22px,7vw,132px)}
.line-a{font-family:var(--display);font-weight:400;
  font-size:clamp(2.9rem,9.4vw,8.4rem);line-height:.94;letter-spacing:-.022em;
  color:var(--ivory);max-width:14ch}
.line-b{font-family:var(--italic);font-style:italic;font-weight:400;
  font-size:clamp(1.7rem,4.4vw,3.9rem);line-height:1;letter-spacing:-.012em;
  color:var(--deep);margin-top:clamp(14px,2.6vh,30px);
  margin-left:clamp(0px,34vw,560px)}

/* Слова выходят из темноты: маска снизу плюс размытие, без движения
   вверх-вниз — это проявление, а не выезд. */
.w{display:inline-block;opacity:0;filter:blur(14px);
  clip-path:inset(0 0 34% 0);
  animation:emerge 2.6s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes emerge{to{opacity:1;filter:blur(0);clip-path:inset(0 0 -20% 0)}}

/* ═══ ДЕЙСТВИЕ ═══ Тонкая рамка цвета слоновой кости. Без свечения. ═══ */
.go{position:absolute;z-index:4;left:clamp(22px,7vw,132px);
  bottom:clamp(42px,9vh,96px);
  display:inline-flex;align-items:center;gap:14px;
  padding:15px 27px;border:1px solid rgba(239,233,223,.34);
  font-family:var(--grotesk);font-size:13px;font-weight:400;letter-spacing:.04em;
  color:var(--ivory);background:transparent;
  opacity:0;animation:emerge 2.4s var(--ease) 2.5s forwards;
  transition:border-color .7s var(--ease),background-color .7s var(--ease)}
.go:hover{border-color:rgba(239,233,223,.62);background:rgba(239,233,223,.045)}
.go i{font-style:normal;font-size:12px;transition:transform .7s var(--ease)}
.go:hover i{transform:translateX(6px)}

/* Подсказка о свете. Уходит навсегда, как только им воспользовались. */
.hint{position:absolute;z-index:4;right:clamp(22px,4.4vw,58px);
  bottom:clamp(46px,9.6vh,100px);
  font-family:var(--grotesk);font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--faint);text-align:right;
  opacity:0;animation:emerge 2.4s var(--ease) 4.2s forwards;
  transition:opacity .8s ease;pointer-events:none}
body.lit-on .hint{opacity:0;animation:none}

@media(hover:hover) and (pointer:fine){.scene{cursor:crosshair}}
@media(hover:none){.hint{display:none}}

@media(max-width:900px){
  .top{padding:22px}
  .line-a{max-width:100%}
  .line-b{margin-left:clamp(0px,18vw,140px)}
  .go{left:22px;right:22px;bottom:36px;justify-content:center}
}

@media(prefers-reduced-motion:reduce){
  .w,.go,.hint,.still{animation:none;opacity:1;filter:none;clip-path:none;transform:none}
  .lit,.video{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="mark">ИСТОК</div>
  <nav>
    <button type="button">Кабинет</button>
    <button type="button">Пройти тест</button>
  </nav>
</header>

<section class="scene">
  <div class="frame" aria-hidden="true">
    <video class="video" id="vid" muted loop playsinline preload="none"
           poster="assets/scene/origin.jpg" data-src="assets/video/hero.mp4"></video>
    <div class="still"></div>

    <!-- Слой света. Маска рвётся турбулентностью, поэтому граница
         неровная и органическая, а не циркульная. -->
    <svg class="lit" id="lit" preserveAspectRatio="none" viewBox="0 0 1440 900">
      <defs>
        <filter id="warp" x="-60%" y="-60%" width="220%" height="220%"
                color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009"
                        numOctaves="4" seed="11" result="noise">
            <animate attributeName="seed" values="11;19;11" dur="24s" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="215"
                             xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="26"/>
        </filter>
        <radialGradient id="soft">
          <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
          <stop offset="46%"  stop-color="#fff" stop-opacity=".92"/>
          <stop offset="74%"  stop-color="#fff" stop-opacity=".46"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="hole" maskUnits="userSpaceOnUse">
          <rect width="100%" height="100%" fill="#000"/>
          <circle id="holeC" cx="720" cy="400" r="300" fill="url(#soft)" filter="url(#warp)"/>
        </mask>
      </defs>
      <image id="litImg" href="assets/fish/goldfish.jpg" x="0" y="0" width="1440" height="900"
             preserveAspectRatio="xMidYMid slice" mask="url(#hole)"/>
    </svg>

    <div class="fade"></div>
  </div>

  <div class="type">
    <h1 class="line-a"><span class="w" style="--d:1.15s">Всё&nbsp;начинается</span></h1>
    <p class="line-b"><span class="w" style="--d:1.95s">в детстве</span></p>
  </div>

  <button class="go" type="button">Начать исследование <i aria-hidden="true">&#8594;</i></button>
  <p class="hint">веди курсором<br>по темноте</p>
</section>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── видео: ни байта не грузим, пока не пройдены проверки ── */
  (function(){
    var v = document.getElementById('vid');
    var c = navigator.connection;
    if (reduce || innerWidth < 900 || (c && (c.saveData || /2g/.test(c.effectiveType || '')))) { v.remove(); return; }
    var ok = false;
    v.addEventListener('playing', function(){ ok = true; v.classList.add('on'); });
    v.addEventListener('error', function(){ v.remove(); });
    setTimeout(function(){ if (!ok) v.remove(); }, 4000);
    v.src = v.dataset.src;
    var p = v.play();
    if (p && p.catch) p.catch(function(){});
  })();

  /* ── свет в темноте ──
     Координаты сглаживаются, поэтому пятно тянется за курсором с
     инерцией воды, а не приклеено к нему. */
  (function(){
    if (reduce) return;
    var svg = document.getElementById('lit'),
        hole = document.getElementById('holeC'),
        img = document.getElementById('litImg');
    var raw = {x:0, y:0}, soft = {x:0, y:0}, raf = null, live = false;

    function size(){
      var w = innerWidth, h = innerHeight;
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      img.setAttribute('width', w); img.setAttribute('height', h);
      hole.setAttribute('r', Math.max(210, Math.min(w, h) * 0.30));
    }
    size();
    addEventListener('resize', size, {passive:true});

    function aim(x, y){
      raw.x = x; raw.y = y;
      if (!live){ live = true; soft.x = x; soft.y = y; document.body.classList.add('lit-on'); }
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function tick(){
      soft.x += (raw.x - soft.x) * .085;
      soft.y += (raw.y - soft.y) * .085;
      hole.setAttribute('cx', soft.x.toFixed(1));
      hole.setAttribute('cy', soft.y.toFixed(1));
      raf = (Math.abs(raw.x - soft.x) > .4 || Math.abs(raw.y - soft.y) > .4)
        ? requestAnimationFrame(tick) : null;
    }

    addEventListener('mousemove', function(e){ aim(e.clientX, e.clientY); }, {passive:true});
    addEventListener('mouseleave', function(){ document.body.classList.remove('lit-on'); live = false; });
    addEventListener('touchstart', function(e){ var t = e.touches[0]; if (t) aim(t.clientX, t.clientY); }, {passive:true});
    addEventListener('touchmove',  function(e){ var t = e.touches[0]; if (t) aim(t.clientX, t.clientY); }, {passive:true});
  })();
})();
</script>
</body>
</html>
